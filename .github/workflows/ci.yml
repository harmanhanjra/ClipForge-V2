name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project and security tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Static security scan
        # B310 is handled by utils.safe_http: urllib calls made directly by
        # utils.audio_engine are restricted to HTTPS provider allowlists and
        # redirect targets are revalidated. Regression tests cover the policy.
        run: bandit -r . -x ./.venv,./tests -ll -s B310
      - name: Dependency vulnerability audit
        if: always()
        # gTTS 2.5.x requires click<8.2. PYSEC-2026-2132 affects click.edit();
        # ClipForge does not call Click or click.edit(). Track removal in SECURITY.md.
        run: python -m pip_audit -r requirements.txt --ignore-vuln PYSEC-2026-2132
